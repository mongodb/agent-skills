name: Public Generated Files Only

# Run the path policy from the trusted public default branch. Do not check out
# or execute PR content in this pull_request_target workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  generated-only:
    runs-on: ubuntu-latest
    steps:
      - name: Limit public PRs to generated plugin copies
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANGED_FILES" -gt 3000 ]; then
            echo "::error::PR exceeds the GitHub changed-files API limit. Split it before review."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-paths"
          if [ "$(wc -l < "$RUNNER_TEMP/changed-paths")" -ne "$CHANGED_FILES" ]; then
            echo "::error::Could not inspect every changed path."
            exit 1
          fi
          bad=0
          while IFS= read -r file; do
            case "$file" in
              plugins/mongodb/skills/*|plugins/mongodb/assets/*|plugins/mongodb-atlas/skills/*|plugins/mongodb-atlas/assets/*) ;;
              *) echo "::error::Public PR changes a private-authored path: $file"; bad=1 ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          [ "$bad" -eq 0 ]
