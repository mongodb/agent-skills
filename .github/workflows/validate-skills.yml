name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
      - ".github/scripts/validate-skills.sh"

permissions:
  contents: read

# TODO: Move validator installation and both validation steps into a reusable
# workflow (`workflow_call`) in `grove-platform/skill-validator`
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is needed so git diff can compare against the base branch
          fetch-depth: 0

      - name: Install skill-validator
        # Uses the grove-platform fork, which adds MongoDB-specific checks
        # (e.g. metadata.labelText) and --allow-token-warnings. The fork keeps
        # the upstream Go module path, so it cannot be installed with
        # `go install`; download the release binary instead.
        #
        # The version is pinned so a stricter validator release cannot fail
        # unrelated open PRs. To upgrade, bump SKILL_VALIDATOR_VERSION in the
        # same PR that fixes any skills the new release flags.
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL_VALIDATOR_VERSION: v1.8.0-grove.1
        run: |
          install_dir="$RUNNER_TEMP/skill-validator"
          mkdir -p "$install_dir"
          gh release download "$SKILL_VALIDATOR_VERSION" --repo grove-platform/skill-validator \
            --pattern '*_linux_amd64.tar.gz' --pattern '*_checksums.txt' \
            --dir "$install_dir"
          (cd "$install_dir" && sha256sum --check --ignore-missing ./*_checksums.txt)
          tar -xzf "$install_dir"/*_linux_amd64.tar.gz -C "$install_dir" skill-validator
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/skill-validator" --version

      - name: Validate changed skills
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "## Changed Skills" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/validate-skills.sh "$BASE_REF"

      - name: Validate all skills
        run: |
          echo "## All Skills" >> "$GITHUB_STEP_SUMMARY"
          skill-validator check --strict --allow-token-warnings --emit-annotations -o markdown skills/ \
            2>&1 | tee >(grep -v '^::' >> "$GITHUB_STEP_SUMMARY")
