name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
      - ".github/scripts/validate-skills.sh"
      - "tools/install-skill-validator.sh"

permissions:
  contents: read

# TODO (ART-252): Move validator installation and both validation steps into a reusable
# workflow (`workflow_call`) in `grove-platform/skill-validator`
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is needed so git diff can compare against the base branch
          fetch-depth: 0

      - name: Install skill-validator
        # The shared installer pins the Grove release and its archive hashes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install_dir="$RUNNER_TEMP/skill-validator"
          bash tools/install-skill-validator.sh "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/skill-validator" --version

      - name: Validate changed skills
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "## Changed Skills" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/validate-skills.sh "$BASE_REF"

      - name: Validate all skills
        run: |
          echo "## All Skills" >> "$GITHUB_STEP_SUMMARY"
          skill-validator check --strict --allow-token-warnings --emit-annotations -o markdown skills/ \
            2>&1 | tee >(grep -v '^::' >> "$GITHUB_STEP_SUMMARY")
