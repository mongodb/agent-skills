name: QA Mutation Battery

# Deliberately manual (`workflow_dispatch` only) until the triggers below are uncommented.
#
# What this does: for a skill, materializes each mutant in its mutation config
# (testing/<skill>/evals/mutation.yaml), runs the QA harness against baseline + every
# mutant, and commits the resulting sensitivity report to
# agent-skills-evals/baselines/<skill>-mutation.json. Advisory only — never blocks a PR.
# It keeps the "what can this suite actually detect?" measurement fresh as skills change.
#
# Before uncommenting `push`/`schedule`:
#   1. The AWS IAM role + GitHub `qa-eval` environment must be provisioned (prereqs in
#      qa-eval.yml's header). The Grove key is fetched from AWS Secrets Manager via OIDC
#      at runtime — never a GitHub secret.
#   2. AGENT_SKILLS_EVALS_APP_ID is a repo secret; the App PEM comes from AWS Secrets
#      Manager at runtime. The App's existing Contents access on agent-skills-evals
#      covers the checkout + baseline commit; no App changes are needed.

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "skills/*/SKILL.md"
  #     - "skills/*/references/**"
  #     - "testing/*/evals/mutation.yaml"
  # schedule:
  #   - cron: "0 6 1 */3 *" # quarterly safety-net census, all skills
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to run the battery for (blank = every skill under skills/)"
        required: false
        type: string
      epochs:
        description: >-
          Repeats per sample. Default 5: below that, run-to-run noise sits above the
          battery's detection threshold and the report is suppressed as unmeasurable —
          a lower-k run spends the model calls and learns nothing.
        required: false
        default: "5"
        type: string

# One battery per skill at a time. Two concurrent batteries interleave their runs in the
# shared qa_runs metadata store and race on the baseline commit.
concurrency:
  group: qa-mutation-battery-${{ github.event.inputs.skill || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # need history to diff against the pre-push SHA

      - name: Determine which skill(s) to run
        id: list
        env:
          SKILL_INPUT: ${{ github.event.inputs.skill }}
        run: |
          set -euo pipefail
          # The skill list is DERIVED from the working tree, never hardcoded. A literal list
          # silently excludes any skill added since it was written -- including community
          # contributions, which are exactly the ones nobody remembers to add. Derived, a new
          # skill is in scope the moment its SKILL.md exists.
          ALL_SKILLS=$(
            for d in skills/*/; do
              [ -f "${d}SKILL.md" ] || continue
              basename "$d"
            done | sort -u | jq -R . | jq -sc .
          )
          echo "Skills on disk: $ALL_SKILLS"

          if [ -n "$SKILL_INPUT" ]; then
            CANDIDATES=$(jq -cn --arg s "$SKILL_INPUT" '[$s]')
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Scope to the skill(s) actually touched by this push, not a full census.
            # `|| true` on the grep: no match must yield an empty list, and under
            # `pipefail` a non-matching grep exits 1 and fails the whole job instead.
            CANDIDATES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | { grep -oE '^(skills|testing)/[^/]+' || true; } \
              | sed -E 's#^(skills|testing)/##' \
              | sort -u \
              | jq -R . | jq -sc .)
          else
            CANDIDATES="$ALL_SKILLS"
          fi

          # Intersect against what is actually on disk. `testing/` also holds non-skill
          # directories (skills-boundaries/) and loose files, so a path-derived name is a
          # CANDIDATE, not a skill — passing one through becomes a matrix entry that fails
          # deep inside mutate_skill.py with "no SKILL.md under ...".
          SKILLS=$(jq -cn --argjson c "$CANDIDATES" --argjson all "$ALL_SKILLS" \
            '$c - ($c - $all)')
          DROPPED=$(jq -cn --argjson c "$CANDIDATES" --argjson all "$ALL_SKILLS" '$c - $all')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Will run the battery for: $SKILLS"
          [ "$DROPPED" = "[]" ] || echo "::notice::Ignored non-skill paths: $DROPPED"

          # A typo'd dispatch input must fail loudly. Silently running nothing looks like a
          # completed census that found no work, which is the same shape as success.
          if [ -n "$SKILL_INPUT" ] && [ "$SKILLS" = "[]" ]; then
            echo "::error::No skill named '$SKILL_INPUT' under skills/. Available: $ALL_SKILLS"
            exit 1
          fi

  battery:
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    strategy:
      fail-fast: false # one skill's battery failing must not cancel the others
      max-parallel: 2 # bounded model-call spend and metadata-store contention
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    runs-on: ubuntu-latest
    # Holds the AWS role ARN + Grove base URL (environment-scoped). The Grove key itself
    # is NOT stored here — fetched from AWS Secrets Manager via OIDC in the steps below.
    # The OIDC trust policy matches on repo:mongodb/agent-skills:environment:qa-eval.
    environment: qa-eval
    permissions:
      contents: read
      id-token: write        # required for AWS OIDC role assumption (Secrets Manager)
    # ~11 mutants plus a baseline, each at --epochs 5, is long but bounded. Without an
    # explicit cap a wedged harness burns the 6h default before anyone notices.
    timeout-minutes: 300
    services:
      # job-local metadata store for qa_runs / mutation_report.py — ephemeral, no secret,
      # unrelated to the functional-slice sandbox Mongo the harness seeds per sample.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: qa_mutation_battery
      EPOCHS: ${{ github.event.inputs.epochs || '5' }}
      # A CONCURRENCY cap, not a case count: each sample of a functional task spins its own
      # agent + mongo container pair. 4 was sized for the k8s sandbox; on a 2-vCPU/7GB
      # ubuntu-latest runner that is 8 containers, and samples OOM-killed into INVALID are
      # samples the harness correctly refuses to score — a wasted run, not a cheap one.
      MAX_SAMPLES: "2"
      # GROVE_API_KEY is injected at runtime by the AWS Secrets Manager step below
      # (no GitHub secret). Base URL is non-sensitive and stays a var.
      GROVE_BASE_URL: ${{ vars.GROVE_BASE_URL }}
    steps:
      # Fail loud, not silent no-op. The Grove key itself is fetched from AWS Secrets
      # Manager below (no GitHub secret), so this guard checks the GitHub-side prereqs
      # that must exist for that fetch to work: the environment-scoped AWS_ROLE_ARN and
      # the GROVE_BASE_URL var. If the push/schedule triggers are uncommented before the
      # `qa-eval` environment + AWS role are provisioned, this fails in one line instead
      # of burning a multi-hour battery on an opaque 401 or no-op'ing while looking green.
      - name: Require model-API credentials (AWS OIDC prereqs)
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          GROVE_BASE_URL: ${{ vars.GROVE_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${AWS_ROLE_ARN:-}" ] && missing+=("AWS_ROLE_ARN (environment secret on qa-eval)")
          [ -z "${GROVE_BASE_URL:-}" ] && missing+=("GROVE_BASE_URL (environment variable on qa-eval)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${missing[*]} not provisioned. This workflow must not be enabled (uncomment its push/schedule triggers) until the GitHub 'qa-eval' environment exists with AWS_ROLE_ARN (secret) + GROVE_BASE_URL (var) and the AWS IAM role + Secrets Manager access are set up (see mongodb/agent-skills#51 / ENTSEC-5465). Fail loud here, not a multi-hour opaque 401."
            exit 1
          fi

      - name: Checkout agent-skills (this repo, public)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: agent-skills

      # Secrets BEFORE the App token: create-github-app-token consumes
      # ${{ env.GITHUB_APP_PRIVATE_KEY }}, which only exists after the Secrets Manager
      # step below exports it (aws-secretsmanager-get-secrets writes each secret to
      # $GITHUB_ENV, visible to `${{ env.* }}` in LATER steps only).
      #
      # No static AWS keys in GitHub: exchange GitHub's OIDC token for short-lived STS
      # creds that may read one secret in the docs AWS account. The role trust is scoped
      # to repo:mongodb/agent-skills:environment:qa-eval, so only this environment can
      # assume it. SHA-pinned because this is a public repo and the job holds id-token:write.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Retrieves both runtime secrets from AWS Secrets Manager (masked in logs), available
      # to the steps below. Neither key lives in GitHub — only the role ARN + base URL do.
      #   GROVE_API_KEY          — model-call key for the harness.
      #   GITHUB_APP_PRIVATE_KEY — PEM for the agent-skills-evals checkout App token.
      - name: Fetch runtime secrets from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            GROVE_API_KEY, agent-skills/grove
            GITHUB_APP_PRIVATE_KEY, agent-skills/gh-app-private-key
          parse-json-secrets: 'false'

      - name: Generate a token for the agent-skills-evals GitHub App
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AGENT_SKILLS_EVALS_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: 10gen
          repositories: agent-skills-evals

      - name: Checkout agent-skills-evals (private, sibling checkout)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 10gen/agent-skills-evals
          token: ${{ steps.app-token.outputs.token }}
          path: agent-skills-evals

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.12"

      - name: Run baseline + every mutant for ${{ matrix.skill }}
        working-directory: agent-skills-evals/inspect
        run: |
          set -euo pipefail
          uv sync

          echo "== BASELINE (unmutated skill, skill-on) at k=$EPOCHS =="
          uv run python harness.py \
            --skill "${{ matrix.skill }}" --epochs "$EPOCHS" --max-samples "$MAX_SAMPLES"

          echo "== MUTATION BATTERY =="
          MUT_DIR=$(mktemp -d)
          uv run python mutate_skill.py --skill "${{ matrix.skill }}" --all --out "$MUT_DIR"
          for d in "$MUT_DIR"/mut-*; do
            [ -d "$d" ] || continue
            echo "-- $(basename "$d") --"
            SKILL_BASE_DIR="$d" uv run python harness.py \
              --skill "${{ matrix.skill }}" --epochs "$EPOCHS" --max-samples "$MAX_SAMPLES"
          done

          echo "== REPORT =="
          uv run python mutation_report.py --skill "${{ matrix.skill }}" --json \
            > "$RUNNER_TEMP/${{ matrix.skill }}-mutation.json"

      # Reports are collected as artifacts and committed ONCE by `publish` below. Committing
      # here would have every matrix job push to agent-skills-evals main concurrently: the
      # first wins, the rest fail on non-fast-forward, and with fail-fast:false a census
      # would quietly lose most of its results.
      - name: Upload the sensitivity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-baseline-${{ matrix.skill }}
          path: ${{ runner.temp }}/${{ matrix.skill }}-mutation.json
          if-no-files-found: error

  publish:
    needs: battery
    if: always() && needs.battery.result != 'skipped'
    runs-on: ubuntu-latest
    # Separate environment from the spend jobs: `publish` never calls Grove, so it must
    # NOT be gated by qa-eval's required-reviewers (else every push/schedule auto-run
    # stalls on approval). It still needs OIDC to fetch the App PEM from Secrets Manager,
    # so it declares its own no-reviewer environment whose sub claim the role trusts.
    environment: qa-eval-publish
    permissions:
      contents: read
      id-token: write        # required for AWS OIDC role assumption (Secrets Manager)
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch App private key from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            GITHUB_APP_PRIVATE_KEY, agent-skills/gh-app-private-key
          parse-json-secrets: 'false'

      - name: Generate a token for the agent-skills-evals GitHub App
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AGENT_SKILLS_EVALS_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: 10gen
          repositories: agent-skills-evals

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 10gen/agent-skills-evals
          token: ${{ steps.app-token.outputs.token }}

      # Whatever succeeded gets published: a skill whose battery failed simply has no
      # artifact, so a partial census still lands its usable half.
      - name: Download every skill's report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-baseline-*
          path: incoming
          merge-multiple: true

      - name: Commit updated baselines in one commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(incoming/*-mutation.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No reports to publish (every battery failed)."
            exit 0
          fi
          mkdir -p baselines
          cp "${FILES[@]}" baselines/
          rm -rf incoming
          git config user.name "agent-skills-evals-bot"
          git config user.email "noreply@mongodb.com"
          git add baselines
          if git diff --cached --quiet; then
            echo "No change to any baseline."
            exit 0
          fi
          git commit -m "chore: refresh mutation baselines (${#FILES[@]} skill(s))"
          # The expected loser-case is a concurrent human commit to main, not a conflict on
          # these files, so rebase and retry rather than failing a several-hour census.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin HEAD && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1
