# Posts the final `qa-eval` commit status (success/failure) after the eval report is
# committed. Fires when testing/*/eval-report.json changes -- i.e. when run-qa-eval.ts
# pushes the report back to the branch. qa-eval-status.yml handles the initial `pending`
# seed on skill pushes; this workflow resolves it.
#
# Checks for every skill changed in the PR:
#   - eval-report.json exists in testing/<skill>/
#   - headSha in the report matches the latest commit touching skills/<skill>/
#   - status is "completed" and passed is true
#
# To generate or refresh a report:
#   cd agent-skills && npx tsx scripts/run-qa-eval.ts --skill <name>
#
# SUPERSEDED IF THE EVERGREEN PATH LANDS -- and then this file should be DELETED, not kept.
# If a mongodb/agent-skills Evergreen project runs the QA eval, Evergreen posts the status
# itself under its own GitHub App. That works for fork PRs, which this cannot: a fork's
# GITHUB_TOKEN is read-only, so the POST above is denied and no context is ever created.
#
# The trap is leaving both in place. Someone then adds the ACTIONS `qa-eval` context to the
# ruleset's required checks, it never posts on a fork PR, and with bypass_actors empty every
# external contribution wedges permanently -- while a green Evergreen check sits next to it.
# Whatever posts the status must be the single thing named in the ruleset.
name: QA Eval Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "testing/*/eval-report.json"

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    # Fork PRs: the built-in GITHUB_TOKEN is read-only, so the statuses POST below is
    # denied. Skipping avoids a cosmetic errored run (the POST 403 was previously
    # swallowed, producing a green run with no qa-eval context). Fork PRs touching
    # skills/ still need a QA eval; a maintainer must run it and push the report on
    # their behalf -- see qa-eval-status.yml for the same guard and rationale.
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check eval report freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Find all skills touched anywhere in this PR (not just this push).
          # `grep ... || true` so an empty match doesn't trip `set -e` -- the no-skills
          # path below posts success ("not required") and exits 0.
          skills=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' \
            | grep '^skills/' \
            | sed 's|skills/\([^/]*\)/.*|\1|' \
            | sort -u || true)

          if [ -z "$skills" ]; then
            gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
              -f state=success \
              -f context=qa-eval \
              -f description="No skill changes — qa-eval not required"
            exit 0
          fi

          failed=0
          summary=""
          for skill in $skills; do
            report="testing/$skill/eval-report.json"

            if [ ! -f "$report" ]; then
              echo "::error file=$report::Missing eval report for '$skill'."
              summary="$summary Missing report for $skill."
              failed=1
              continue
            fi

            latest_skill_sha=$(git log --format='%H' -1 -- "skills/$skill/")
            report_sha=$(jq -r '.headSha // empty' "$report")

            if [ -z "$report_sha" ]; then
              echo "::error file=$report::Eval report for '$skill' has no headSha field. Re-run the eval."
              summary="$summary $skill: no headSha."
              failed=1
              continue
            fi

            if [ "$report_sha" != "$latest_skill_sha" ]; then
              echo "::error file=$report::Eval report for '$skill' is stale (report: ${report_sha:0:8}, skill head: ${latest_skill_sha:0:8}). Re-run the eval."
              summary="$summary $skill: stale report."
              failed=1
              continue
            fi

            status=$(jq -r '.status' "$report")
            if [ "$status" != "completed" ]; then
              echo "::error file=$report::Eval for '$skill' did not complete (status: $status)."
              summary="$summary $skill: status=$status."
              failed=1
              continue
            fi

            passed=$(jq -r '.passed' "$report")
            if [ "$passed" != "true" ]; then
              echo "::error file=$report::Eval for '$skill' did not pass."
              summary="$summary $skill: failed."
              failed=1
              continue
            fi

            echo "✅ $skill: fresh and passing"
          done

          if [ "$failed" -eq 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
              -f state=success \
              -f context=qa-eval \
              -f description="All skill evals passed" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            # GitHub caps status descriptions at 140 chars; truncate the per-skill
            # failure summary so a run with many failing skills doesn't 422 the POST.
            desc="QA eval failed:$summary"
            desc="${desc:0:140}"
            gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
              -f state=failure \
              -f context=qa-eval \
              -f description="$desc" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          exit $failed
