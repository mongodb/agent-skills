name: Draft Release

on:
  push:
    branches:
      - main
    paths:
      - "gemini-extension.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - "plugins/*/.cursor-plugin/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
      - "plugins/*/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # No root package.json: the version comes from tools' packageManager.
          package_json_file: tools/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # engines.node (Node 24+ runs the TypeScript release tooling directly
          # via type-stripping).
          node-version-file: tools/package.json
          cache: "pnpm"
          cache-dependency-path: tools/pnpm-lock.yaml

      - name: Install tools dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools

      - name: Read and validate plugin versions
        id: version
        shell: bash
        # Validates lockstep and emits release_tag to $GITHUB_OUTPUT.
        run: node tools/plugin-version.ts check

      - name: Skip when release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${{ steps.version.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release with generated notes
        if: ${{ steps.exists.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.version.outputs.release_tag }}" \
            --title "${{ steps.version.outputs.release_tag }}" \
            --target "$GITHUB_SHA" \
            --draft \
            --generate-notes
