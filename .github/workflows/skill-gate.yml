# skill-gate — security gate for Agent Skill content.
#
# Runs the COMPLETE skill-gate scan (static patterns + LLM-as-judge) on the
# skill bundles changed in a PR and reports a single verdict as the required
# `skill-gate` commit status. Triggered manually by a maintainer comment so the
# Grove (LLM) spend is tied to deliberate runs, not every push.
#
# Trigger:   comment `/skill-gate` on a PR (authorized users only).
# Enforce:   the `main` ruleset requires the `skill-gate` status check; this job
#            posts that status to the PR HEAD sha (see skill-gate-required.yml
#            for the default-red seed that blocks un-scanned PRs).
name: skill-gate

on:
  issue_comment:
    types: [created]

# Built-in GITHUB_TOKEN only (ephemeral, repo-scoped) — no PAT, no stored token.
# No write scope beyond commit statuses: findings surface via the job summary
# and PR Checks annotations (neither needs a token), so we don't post a PR
# comment and don't request pull-requests:write.
permissions:
  contents: read
  pull-requests: read    # read PR head sha + changed files (no write scope)
  statuses: write        # post the `skill-gate` commit status

concurrency:
  group: skill-gate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  scan:
    # Only on PR comments that invoke the command, from a repo owner or org
    # member (author_association). A fork PR from an org member still reports
    # MEMBER, so members self-trigger even on fork PRs; a true outside
    # contributor (CONTRIBUTOR/NONE) can't — a member runs it for them.
    # COLLABORATOR is intentionally omitted: this repo has no outside
    # collaborators and all contributors are org members.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/skill-gate') &&
      contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # Gated environment that holds the Grove Service key (and optional required
    # reviewers). See setup doc step 3.
    environment: skill-gate
    steps:
      - name: Resolve PR head/base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # issue_comment runs in the default-branch context, so github.sha is
          # main's tip — NOT the PR head. Resolve the real head sha to scan it
          # and to attach the status where the ruleset will look for it.
          head_sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq '.head.sha')
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Mark status in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f state=pending -f context=skill-gate -f description="Scanning…" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Check out PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Install skill-gate (pinned)
        # Mirrors the existing `go install …skill-validator@…` step.
        run: go install github.com/mongodb/skill-gate/cmd/skill-gate@v0.1.0

      - name: Determine changed skill bundles
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/files" --paginate \
            --jq '.[].filename' \
            | grep '^skills/' | cut -d/ -f1-2 | sort -u > changed_skills.txt || true
          count=$(grep -c . changed_skills.txt || true)
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Run skill-gate (complete scan — static + LLM judge)
        id: scan
        if: steps.changed.outputs.count != '0'
        env:
          # Grove Service key + gateway, supplied by the gated environment.
          ANTHROPIC_API_KEY: ${{ secrets.GROVE_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.GROVE_BASE_URL }}
          ANTHROPIC_AUTH_HEADER: api-key
        run: |
          worst=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            # Skip skills deleted in this PR (dir no longer on disk).
            if [ ! -d "$dir" ]; then
              echo "Skipping deleted skill: $dir"
              continue
            fi
            echo "## \`$dir\`" >> "$GITHUB_STEP_SUMMARY"
            set +e
            # --emit-annotations writes ::error/::warning to stdout (GitHub pins
            # these to the diff in the PR Checks tab) alongside the markdown report.
            out=$(skill-gate scan "./$dir/" -o markdown --emit-annotations 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"                                             # annotations -> run log / PR Checks
            printf '%s\n' "$out" | grep -v '^::' >> "$GITHUB_STEP_SUMMARY"   # report -> job summary
            [ "$rc" -gt "$worst" ] && worst=$rc
          done < changed_skills.txt
          # Exit codes: 0 AUTO-PASS, 1 WARN, 2 ESCALATE. Fail closed on anything
          # unexpected (e.g. a judge tool-error returns non-0/1/2).
          echo "verdict_code=$worst" >> "$GITHUB_OUTPUT"

      - name: Report verdict (commit status)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="${{ steps.scan.outputs.verdict_code }}"
          case "$code" in
            ""|"0") state=success; label="AUTO-PASS — no criteria triggered" ;;
            "1")    state=success; label="WARN — advisory; author resolves, Docs confirms in review" ;;
            "2")    state=failure; label="ESCALATE — Security review required before merge" ;;
            *)      state=failure; label="skill-gate error (fail closed) — see run log" ;;
          esac
          # POLICY LEVER: WARN maps to success here (per the tooling proposal:
          # WARN = author resolution confirmed by Docs during review). Flip to
          # `failure` if you want WARN to hard-block merge.
          #
          # Status only — no PR comment. The verdict's findings live in the job
          # summary + PR Checks annotations; target_url points reviewers there.
          # This keeps the token free of pull-requests:write.
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f state="$state" -f context=skill-gate -f description="$label" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
