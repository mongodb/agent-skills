name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version_source:
        description: "How to determine the next version"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - exact
      exact_version:
        description: "Exact version (required when version_source=exact), e.g. 1.2.3"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 runs the TypeScript release tooling directly via type-stripping.
          node-version: "24"

      - name: Install tools dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools

      - name: Compute and apply version bump
        id: version
        shell: bash
        env:
          VERSION_SOURCE: ${{ inputs.version_source }}
          EXACT_VERSION: ${{ inputs.exact_version }}
        run: |
          set -euo pipefail
          # Validates lockstep, computes the next version, rewrites every plugin
          # manifest in place (format-preserving), and emits current_version /
          # target_version / branch_name to $GITHUB_OUTPUT.
          if [[ "$VERSION_SOURCE" == "exact" ]]; then
            node tools/plugin-version.ts bump exact "${EXACT_VERSION:-}"
          else
            node tools/plugin-version.ts bump "$VERSION_SOURCE"
          fi

      - name: Create release pull request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # 8.1.0
        with:
          base: main
          branch: ${{ steps.version.outputs.branch_name }}
          title: "chore: prepare release v${{ steps.version.outputs.target_version }}"
          commit-message: "chore: bump plugin versions to v${{ steps.version.outputs.target_version }}"
          body: |
            ## Summary
            - Bump plugin version from `${{ steps.version.outputs.current_version }}` to `${{ steps.version.outputs.target_version }}`

            ## Next step
            - Merge this PR to trigger draft release creation.
