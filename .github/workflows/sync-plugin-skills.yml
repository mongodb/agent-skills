name: Plugin Skills Sync

# The canonical skills live in skills/. Each plugin under plugins/ ships its own
# committed copy, generated by tools/sync-plugin-skills.ts. This job regenerates
# those copies and fails if the committed result drifts from the canonical source
# (or from assets/), so the per-plugin copies can never go stale.

on:
  pull_request:
    paths:
      - "skills/**"
      - "assets/**"
      - "LICENSE"
      - "plugins/**"
      - "tools/sync-plugin-skills.ts"

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # No root package.json: the version comes from tools' packageManager.
          package_json_file: tools/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # engines.node (Node 24+ strips TypeScript types directly, so the .ts
          # scripts run without a transpile step).
          node-version-file: tools/package.json
          cache: "pnpm"
          cache-dependency-path: tools/pnpm-lock.yaml

      - name: Install tools dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools

      - name: Sync plugin skills
        run: node tools/sync-plugin-skills.ts

      - name: Check OpenCode parser copies are identical
        # Each OpenCode package is self-contained, so skills.ts and its test are
        # duplicated per plugin. Only index.ts may differ between the two.
        run: |
          for f in skills.ts skills.test.ts; do
            if ! diff -u "plugins/mongodb/.opencode-plugin/$f" "plugins/mongodb-atlas/.opencode-plugin/$f"; then
              echo "::error::plugins/*/.opencode-plugin/$f differ. Apply the same change to both copies."
              exit 1
            fi
          done

      - name: Run OpenCode plugin unit tests
        run: |
          node --test plugins/mongodb/.opencode-plugin/skills.test.ts
          node --test plugins/mongodb-atlas/.opencode-plugin/skills.test.ts

      - name: Type-check OpenCode plugins
        # Checks index.ts against the real @opencode/plugin API, which the unit
        # tests can't (they cover only the dependency-free skills.ts). The plugins
        # have no lockfile, so this checks the latest @opencode/plugin in range,
        # the version users' OpenCode is most likely to run.
        run: |
          for dir in plugins/mongodb plugins/mongodb-atlas; do
            (cd "$dir" && pnpm install --no-frozen-lockfile && pnpm run typecheck)
          done

      - name: Check for drift
        run: |
          # Include untracked files: a newly synced skill shows up as untracked,
          # which `git diff` alone would not report.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo ""
            echo "::error::Plugin skill/asset copies are out of sync with the canonical sources."
            echo "Run 'node tools/sync-plugin-skills.ts' locally and commit the result."
            exit 1
          fi
