name: Plugin Skills Sync

# The canonical skills live in skills/. Each plugin under plugins/ ships its own
# committed copy, generated by tools/sync-plugin-skills.ts. This job regenerates
# those copies and fails if the committed result drifts from the canonical source
# (or from assets/), so the per-plugin copies can never go stale.

on:
  pull_request:
    paths:
      - "skills/**"
      - "assets/**"
      - "plugins/**"
      - "tools/sync-plugin-skills.ts"

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.7.0"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 strips TypeScript types directly, so the .ts script runs
          # without a transpile step.
          node-version: "24"

      - name: Install tools dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools

      - name: Sync plugin skills
        run: node tools/sync-plugin-skills.ts

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "::error::Plugin skill/asset copies are out of sync with the canonical sources."
            echo "Run 'node tools/sync-plugin-skills.ts' locally and commit the result."
            exit 1
          fi
