name: Plugin Skills Sync

# Only generated plugin copies are authored by PRs in this public repository.
# Canonical skills, manifests, and the generator are mirrored from private.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.7.0"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 strips TypeScript types directly, so the .ts script runs
          # without a transpile step.
          node-version: "24"

      - name: Install tools dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools

      - name: Sync plugin skills
        run: node tools/sync-plugin-skills.ts

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- plugins/mongodb/skills plugins/mongodb/assets plugins/mongodb-atlas/skills plugins/mongodb-atlas/assets)" ]; then
            echo ""
            echo "::error::Plugin skill/asset copies are out of sync with the canonical sources."
            echo "Run 'node tools/sync-plugin-skills.ts' in this public repo and commit only generated copies."
            exit 1
          fi
