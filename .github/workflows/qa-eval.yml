# qa-eval — capability gate for Agent Skills.
#
# Runs the Inspect-AI QA harness (10gen/agent-skills-evals, inspect/) against the skill
# content changed in a PR and reports the verdict as the `qa-eval` check run (seeded by
# qa-eval-status.yml). Triggered manually by a maintainer comment so the Grove (LLM)
# spend is tied to deliberate runs, not every push.
#
# Trigger:   comment `/qa-eval` (optionally `/qa-eval <skill>`) on a PR. OWNER/MEMBER only.
#            workflow_dispatch with a pr_number is the smoke-test path.
# Enforce:   the `main` ruleset requires the `qa-eval` check; qa-eval-status.yml seeds it.
#
# Supersedes the report-commit design (eval-report.json committed to testing/<skill>/,
# verified by the since-deleted qa-eval-check.yml). The report now lives ON the check run
# (output.summary) + as a workflow artifact, because:
#   - the workflow evaluates a specific SHA and posts onto that same SHA, so the old
#     headSha freshness check is inherent rather than verified after the fact;
#   - check runs are created in the base repo's context, so FORK PRs are covered (a
#     committed report could never be pushed to a fork branch);
#   - no machine-generated commits in git history.
#
# Security — mirrors the collect/scan split from skill-gate.yml (PR #51, approved under
# ENTSEC-5465): the untrusted PR-head checkout lives in the UNPRIVILEGED `collect` job
# (no environment, no id-token, no secrets); the privileged `eval` job
# (environment: qa-eval, id-token: write) receives that content as an artifact and never
# checks out a PR ref. The Grove key is fetched from AWS Secrets Manager via OIDC at
# runtime; it is never a GitHub secret.
#
# HONEST CAVEAT (same as qa-pr-screen.yml): the split protects credential custody, but
# the harness EXECUTES untrusted eval-case YAML with the Grove key in its env. The
# OWNER/MEMBER-only trigger is the actual control for that; do not widen it.
#
# PUBLIC-CONTENT RULE: this is a public repo — job logs, artifacts, check-run output, and
# PR comments are all world-visible. The check-run summary and PR comment are built only
# from fields we generate ourselves (skill names, verdicts, integer counts, URLs) — never
# model output or transcript text. If that ever changes, the content must go through
# agent-skills-evals/inspect/analysis/sanitize.py (public_safe_run) first, the same
# allowlisting screen_report.py uses.
#
# Prereqs (see the setup runbook + ENTSEC-5465):
#   - repo variable QA_EVAL_ENABLED = 'true' (kill switch; also arms qa-eval-status.yml)
#   - GitHub environment `qa-eval` with secret AWS_ROLE_ARN + variable GROVE_BASE_URL
#   - AWS IAM role trusted for repo:mongodb/agent-skills:environment:qa-eval, allowed to
#     read Secrets Manager secrets agent-skills/grove and agent-skills/gh-app-private-key
#   - repo secret AGENT_SKILLS_EVALS_APP_ID (App ID; non-sensitive)
#   - 10gen/agent-skills-evals#18 merged (provides harness.py + scripts/ci_gate.py)
#
# Rollout verification item: INCONCLUSIVE maps to check-run conclusion `neutral`. Confirm
# against the live ruleset that `neutral` does NOT satisfy a required `qa-eval` check —
# an inconclusive (instrument-fault) run must be re-run, not merged through. If neutral
# turns out to satisfy the ruleset, gate on success explicitly in the finalize step.
name: QA Eval

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to eval"
        required: true
        type: string
      skill:
        description: "Skill to eval (blank = all skills changed in the PR)"
        required: false
        type: string

# Built-in GITHUB_TOKEN only (ephemeral, repo-scoped). Nothing granted at the top level;
# permissions are declared per job (least privilege).
permissions: {}

# Serialize per PR, but do NOT cancel an in-flight run: a run costs real model spend and
# up to ~an hour, and a cancelled job leaves the check run stuck in_progress. A second
# /qa-eval comment simply queues behind the first.
concurrency:
  group: qa-eval-${{ github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

env:
  # Kept in lockstep with qa-pr-screen.yml and harness.py's default.
  PANEL_MODEL: anthropic/claude-sonnet-4-6
  # A CONCURRENCY cap, not a case count: each sample of a functional task spins its own
  # agent + mongo container pair. Matches qa-pr-screen.yml's sizing for 2-vCPU runners.
  MAX_SAMPLES: "2"

jobs:
  # UNPRIVILEGED data-only checkout of the PR head. No `environment:`, no id-token, no
  # secrets — it cannot assume the AWS role or reach the Grove key (the point of the
  # split). Stages the changed skills + their eval cases as an artifact for `eval`.
  collect:
    if: >-
      vars.QA_EVAL_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/qa-eval') &&
          contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - name: Resolve PR head/base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # issue_comment runs in the default-branch context, so github.sha is main's
          # tip — NOT the PR head. Resolve the real head sha to eval it and to attach
          # the check run where the ruleset will look for it.
          read -r head_sha base_sha <<<"$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '.head.sha + " " + .base.sha')"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out skill + eval content (data only)
        # DATA-ONLY untrusted checkout, in the UNPRIVILEGED job: SHA-pinned, no persisted
        # token, sparse skills/ + testing/ tree. Nothing here is built or executed — it
        # is uploaded as an artifact and consumed by the harness in `eval`.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false
          sparse-checkout: |
            skills
            testing
          fetch-depth: 0 # need history to diff base..head for changed-skill detection

      - name: Determine which skill(s) to eval
        id: list
        env:
          SKILL_ARG: ${{ github.event_name == 'workflow_dispatch' && inputs.skill || '' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Every skill on disk = dirs under skills/ with a SKILL.md. DERIVED, never a
          # hardcoded list, so a brand-new skill in a community PR is in scope the
          # moment it exists.
          ALL_SKILLS=$(
            for d in skills/*/; do
              [ -f "${d}SKILL.md" ] || continue
              basename "$d"
            done | sort -u | jq -R . | jq -sc .
          )

          # Optional explicit skill: `/qa-eval <skill>` or the dispatch input. First
          # token of the comment must be exactly `/qa-eval` (startsWith in the job `if`
          # also matches e.g. `/qa-evaluate`; the strict parse happens here).
          REQUESTED="$SKILL_ARG"
          if [ -z "$REQUESTED" ] && [ "${{ github.event_name }}" = "issue_comment" ]; then
            FIRST_LINE=$(printf '%s' "$COMMENT_BODY" | head -1)
            CMD=$(printf '%s' "$FIRST_LINE" | awk '{print $1}')
            if [ "$CMD" != "/qa-eval" ]; then
              echo "::notice::Comment does not start with the exact /qa-eval command; skipping."
              echo "skills=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            REQUESTED=$(printf '%s' "$FIRST_LINE" | awk '{print $2}')
          fi

          if [ -n "$REQUESTED" ]; then
            CANDIDATES=$(jq -cn --arg s "$REQUESTED" '[$s]')
          else
            # Skills changed anywhere in this PR (base..head), derived from the tree.
            # `|| true` on the grep: no match is a legitimate empty list, but under
            # pipefail a non-matching grep exits 1 and fails the job instead.
            CANDIDATES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | { grep -oE '^(skills|testing)/[^/]+' || true; } \
              | sed -E 's#^(skills|testing)/##' \
              | sort -u \
              | jq -R . | jq -sc .)
          fi

          # Intersect against what is on disk: testing/ also holds non-skill paths, so a
          # path-derived name is a CANDIDATE, not a skill. Passing one through fails deep
          # inside the harness on a skill that does not exist.
          SKILLS=$(jq -cn --argjson c "$CANDIDATES" --argjson all "$ALL_SKILLS" \
            '$c - ($c - $all)')
          DROPPED=$(jq -cn --argjson c "$CANDIDATES" --argjson all "$ALL_SKILLS" '$c - $all')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Will eval: $SKILLS"
          [ "$DROPPED" = "[]" ] || echo "::notice::Ignored non-skill paths: $DROPPED"

          # A typo'd explicit request must fail loudly — silently running nothing looks
          # like a completed eval that found no work, which is the same shape as success.
          if [ -n "$REQUESTED" ] && [ "$SKILLS" = "[]" ]; then
            echo "::error::No skill named '$REQUESTED' under skills/. Available: $ALL_SKILLS"
            exit 1
          fi

      - name: Upload eval input
        if: steps.list.outputs.skills != '[]'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-eval-input-${{ steps.pr.outputs.head_sha }}
          path: |
            skills
            testing
          retention-days: 1
          if-no-files-found: error

  # PRIVILEGED job. Holds environment: qa-eval + id-token: write, assumes the AWS role
  # via OIDC, fetches the Grove key from Secrets Manager, and runs the harness. It NEVER
  # checks out a PR ref: the untrusted content arrives as an artifact from `collect`.
  eval:
    needs: collect
    if: needs.collect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    environment: qa-eval
    permissions:
      contents: read
      pull-requests: write   # post/update the summary comment on the PR
      checks: write          # drive the `qa-eval` check run lifecycle
      id-token: write        # AWS OIDC role assumption (Secrets Manager)
    timeout-minutes: 90
    env:
      # GROVE_API_KEY is injected at runtime by the AWS Secrets Manager step (no GitHub
      # secret). Base URL is non-sensitive and stays a var.
      GROVE_BASE_URL: ${{ vars.GROVE_BASE_URL }}
    steps:
      # Fail loud, not silent no-op: verify the GitHub-side prereqs for the AWS fetch
      # before spending anything. See header prereqs.
      - name: Require model-API credentials (AWS OIDC prereqs)
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          GROVE_BASE_URL: ${{ vars.GROVE_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${AWS_ROLE_ARN:-}" ] && missing+=("AWS_ROLE_ARN (environment secret on qa-eval)")
          [ -z "${GROVE_BASE_URL:-}" ] && missing+=("GROVE_BASE_URL (environment variable on qa-eval)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${missing[*]} not provisioned. See the header of qa-eval.yml (ENTSEC-5465 setup). Fail loud here, not an opaque 401."
            exit 1
          fi

      - name: Start the qa-eval check run (in_progress)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
        run: |
          set -euo pipefail
          # The seeder normally created this check run (state queued). It may be absent —
          # e.g. a fork PR, where the seeder skips but a member-triggered /qa-eval still
          # runs here in the base-repo context (which is exactly how forks get covered).
          CHECK_RUN_ID=$(gh api \
            "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?check_name=qa-eval&filter=latest" \
            --jq '.check_runs[0].id // empty')
          if [ -z "$CHECK_RUN_ID" ]; then
            CHECK_RUN_ID=$(gh api -X POST "repos/${{ github.repository }}/check-runs" \
              -f name=qa-eval -f head_sha="$HEAD_SHA" -f status=queued --jq '.id')
          fi
          gh api -X PATCH "repos/${{ github.repository }}/check-runs/$CHECK_RUN_ID" \
            -f status=in_progress \
            -f "output[title]=QA eval running" \
            -f "output[summary]=Evaluating changed skills against the QA harness…" \
            > /dev/null
          echo "CHECK_RUN_ID=$CHECK_RUN_ID" >> "$GITHUB_ENV"

      - name: Download staged PR content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-eval-input-${{ needs.collect.outputs.head_sha }}
          path: agent-skills

      # Secrets BEFORE the App token: create-github-app-token consumes
      # ${{ env.GITHUB_APP_PRIVATE_KEY }}, which only exists after the Secrets Manager
      # step exports it. (aws-secretsmanager-get-secrets writes each secret to
      # $GITHUB_ENV, making it visible to `${{ env.* }}` in LATER steps only.)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch runtime secrets from AWS Secrets Manager
        # GROVE_API_KEY          — model-call key for the harness.
        # GITHUB_APP_PRIVATE_KEY — PEM for the agent-skills-evals checkout App token.
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            GROVE_API_KEY, agent-skills/grove
            GITHUB_APP_PRIVATE_KEY, agent-skills/gh-app-private-key
          parse-json-secrets: 'false'

      - name: Generate a token for the agent-skills-evals GitHub App
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AGENT_SKILLS_EVALS_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: 10gen
          repositories: agent-skills-evals

      - name: Checkout agent-skills-evals (private, sibling checkout)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 10gen/agent-skills-evals
          token: ${{ steps.app-token.outputs.token }}
          path: agent-skills-evals
          ref: ${{ vars.QA_EVALS_REF || 'main' }}

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.12"

      - name: Run harness + gate per skill
        env:
          SKILLS: ${{ needs.collect.outputs.skills }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          BASE_SHA: ${{ needs.collect.outputs.base_sha }}
          SKILL_BASE_DIR: ${{ github.workspace }}/agent-skills/skills
          QA_TESTING_DIR: ${{ github.workspace }}/agent-skills/testing
          SEED_BASE_DIR: ${{ github.workspace }}/agent-skills/testing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          cd agent-skills-evals/inspect
          uv sync --quiet

          echo "[" > "$RUNNER_TEMP/reports/index.json.tmp"
          first=1
          for SKILL in $(echo "$SKILLS" | jq -r '.[]'); do
            echo "== QA eval: $SKILL (model $PANEL_MODEL, k=1) =="

            set +e
            uv run python harness.py --skill "$SKILL" --model "$PANEL_MODEL" \
              --epochs 1 --max-samples "$MAX_SAMPLES"
            HARNESS_RC=$?
            set -e

            # Only gate a log when the harness itself completed: a crashed harness may
            # leave no log (or a partial one), and "no measurement" is INCONCLUSIVE, not
            # FAIL. ci_gate reads the NEWEST log in logs/, which — running sequentially —
            # is this skill's run.
            if [ "$HARNESS_RC" -eq 0 ]; then
              set +e
              uv run python ../scripts/ci_gate.py logs --mode strict
              GATE_RC=$?
              set -e
            else
              GATE_RC=2
              echo "harness exited $HARNESS_RC for $SKILL — treating as INCONCLUSIVE"
            fi

            case "$GATE_RC" in
              0) verdict=pass ;;
              1) verdict=fail ;;
              *) verdict=inconclusive ;;
            esac

            REPORT="$RUNNER_TEMP/reports/qa-eval-report-$SKILL.json"
            jq -cn \
              --arg skill "$SKILL" \
              --arg headSha "$HEAD_SHA" \
              --arg baseSha "$BASE_SHA" \
              --arg model "$PANEL_MODEL" \
              --arg verdict "$verdict" \
              --arg runAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{skillName: $skill, headSha: $headSha, baseSha: $baseSha, model: $model,
                verdict: $verdict, runAt: $runAt}' > "$REPORT"

            [ "$first" -eq 0 ] && echo "," >> "$RUNNER_TEMP/reports/index.json.tmp"
            first=0
            jq -cn --arg skill "$SKILL" --arg verdict "$verdict" \
              '{skill: $skill, verdict: $verdict}' >> "$RUNNER_TEMP/reports/index.json.tmp"
          done
          echo "]" >> "$RUNNER_TEMP/reports/index.json.tmp"
          mv "$RUNNER_TEMP/reports/index.json.tmp" "$RUNNER_TEMP/reports/index.json"

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-eval-report-${{ needs.collect.outputs.head_sha }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn

      - name: Finalize check run + post PR summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.collect.outputs.pr_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -f "$RUNNER_TEMP/reports/index.json" ]; then
            FAILS=$(jq '[.[] | select(.verdict == "fail")] | length' "$RUNNER_TEMP/reports/index.json")
            INCONCLUSIVE=$(jq '[.[] | select(.verdict == "inconclusive")] | length' "$RUNNER_TEMP/reports/index.json")
            if [ "$FAILS" -gt 0 ]; then
              CONCLUSION=failure
              TITLE="QA eval failed"
            elif [ "$INCONCLUSIVE" -gt 0 ]; then
              # INCONCLUSIVE = instrument fault (Grove 401, MCP registration failure,
              # harness crash), not a verdict on the PR. `neutral` is deliberate: it must
              # not count against the author, and the run should be re-triggered.
              CONCLUSION=neutral
              TITLE="QA eval inconclusive — re-run needed"
            else
              CONCLUSION=success
              TITLE="QA eval passed"
            fi
          else
            CONCLUSION=neutral
            TITLE="QA eval did not produce results"
          fi

          # Summary is built ONLY from self-generated fields (skill names, verdicts,
          # URLs) — no model output. See the PUBLIC-CONTENT RULE in the header.
          {
            echo "| Skill | Verdict |"
            echo "|-------|---------|"
            if [ -f "$RUNNER_TEMP/reports/index.json" ]; then
              jq -r '.[] | "| \(.skill) | \(.verdict) |"' "$RUNNER_TEMP/reports/index.json"
            else
              echo "| (all) | no results — see run log |"
            fi
            echo ""
            echo "Model: \`$PANEL_MODEL\`. Full per-skill JSON reports: artifact"
            echo "\`qa-eval-report-*\` on [the run page]($RUN_URL)."
          } > "$RUNNER_TEMP/summary.md"

          CHECK_RUN_HTML=$(gh api -X PATCH \
            "repos/${{ github.repository }}/check-runs/${{ env.CHECK_RUN_ID }}" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=$TITLE" \
            -F "output[summary]=@$RUNNER_TEMP/summary.md" \
            --jq '.html_url')

          # One marker comment per PR, updated in place on re-runs — successive /qa-eval
          # comments must not stack new comments.
          MARKER="<!-- qa-eval-gate -->"
          {
            echo "$MARKER"
            echo "### QA eval: $TITLE"
            echo ""
            cat "$RUNNER_TEMP/summary.md"
            echo ""
            echo "Details: [$TITLE]($CHECK_RUN_HTML) (check run report)."
          } > "$RUNNER_TEMP/comment.md"

          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING" -X PATCH \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -X POST \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi

          # The workflow's own exit code reflects the verdict so the run page and any
          # `gh run watch` caller read it correctly. (The check run is the merge gate;
          # this job's status is for operators.)
          [ "$CONCLUSION" != "failure" ]
