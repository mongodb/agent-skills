name: QA PR Screen Check

# DRAFT — checked in but deliberately not wired to fire automatically yet. Three blockers,
# all of which must land before the `pull_request` trigger below is uncommented:
#
#   1. The Grove-secret custody review (see qa-mutation-battery.yml's header).
#   2. AGENT_SKILLS_EVALS_APP_ID / AGENT_SKILLS_EVALS_APP_PRIVATE_KEY as Actions secrets on
#      THIS repo — a secrets-provisioning step, not an App-installation change; see that
#      file's header for why the App does not need to be installed on agent-skills for this
#      workflow's cross-repo checkout to work.
#   3. FORK PRs -- and note this whole blocker DISSOLVES if the eval moves to Evergreen,
#      which runs inside the network and gates outside-org patches natively. If that lands,
#      this workflow is superseded and should be deleted rather than maintained alongside.
#      Until then: this repo is public and takes community contributions
#      (README.community.md), and a `pull_request` run from a fork gets NO secrets. So the
#      moment that trigger goes live, every external contributor's PR would get a screen
#      job with no GROVE_API_KEY, failing on the harness step — an intimidating red X on a
#      first-time contribution, for a check that is explicitly advisory. Handled below by
#      scoping `screen` to same-repo PRs and telling forks once, in the job summary, that a
#      maintainer can dispatch it. The alternative that DOES get secrets,
#      `pull_request_target`, would run harness code and eval cases from an untrusted PR
#      head with credentials in the environment; that needs a maintainer approval gate in
#      front of it and is a deliberate decision to make, not a default to fall into.
#
# What this does: for a changed skill, runs the skill-on (and skill-off, for the lift
# number) arm ONCE (k=1 — this is a screen, not a measurement; see harness.py's --epochs
# docstring on why more epochs wouldn't even help a per-PR decision), then posts a PR
# comment built by agent-skills-evals/inspect/screen_report.py. That script routes
# everything through analysis.sanitize.public_safe_run first — see that module's
# docstring for why allowlisting, not scrubbing, is what makes this safe to post on a
# public PR at all — and suppresses the lift line entirely when the two arms are not
# comparable (arm_balance) or either arm is inconclusive, rather than publishing a number
# that is mostly an environment difference.
#
# This is Tier 2/3 from DESIGN.md's tiering (behavioral + judge, ADVISORY, never blocks).
# Tier 1 (schema validation, skill lint, plugin-copy drift, asset-exists, answer-echo) is
# already live and blocking today via validate-skills.yml / validate-eval-cases.yml /
# sync-plugin-skills.yml — this workflow does not duplicate any of that.

on:
  # pull_request:
  #   paths:
  #     - "skills/*/SKILL.md"
  #     - "skills/*/references/**"
  #     - "testing/*/evals/**"
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to screen"
        required: true
        type: string
      pr_number:
        description: "PR number to comment on (leave blank to just print the comment body)"
        required: false
        type: string

# One screen per PR (or per dispatched skill). Two pushes in quick succession would
# otherwise race on the same marker comment and can double-post instead of updating.
concurrency:
  group: qa-pr-screen-${{ github.event.pull_request.number || github.event.inputs.skill }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Kept in lockstep with harness.py's and screen_report.py's default, and passed
  # explicitly to both. screen_report reads the LATEST qa_runs doc for --skill/--model, so
  # a drift between the two defaults doesn't produce a wrong number — it produces "no
  # skill-on qa_runs doc found" and a failure nobody can read.
  PANEL_MODEL: anthropic/claude-sonnet-4-6

jobs:
  # A fork PR cannot reach the model API, so say so once instead of failing a contributor's
  # PR on an advisory check. See blocker 3 in the header.
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Explain why no screen ran
        run: |
          {
            echo "### QA screen check skipped"
            echo
            echo "This PR is from a fork, and fork workflow runs have no access to the"
            echo "model-API credentials this check needs. The check is **advisory** and"
            echo "never blocks a merge — a maintainer can run it on demand from the"
            echo "\"QA PR Screen Check\" workflow_dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

  detect:
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine which skill(s) changed in this PR
        id: list
        run: |
          set -euo pipefail
          # DERIVED from the working tree, never a hardcoded list. Because `pull_request`
          # checks out the merge ref, a skill ADDED by this PR is already on disk here — so a
          # community PR contributing a brand-new skill gets screened, which a literal list of
          # today's skills would silently exclude (the case that motivated this: mongodb/agent-skills#50).
          ALL_SKILLS=$(
            for d in skills/*/; do
              [ -f "${d}SKILL.md" ] || continue
              basename "$d"
            done | sort -u | jq -R . | jq -sc .
          )
          # `|| true` on the grep: no match must yield an empty list, but under `pipefail` a
          # non-matching grep exits 1 and fails the whole job instead.
          CANDIDATES=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
            | { grep -oE '^(skills|testing)/[^/]+' || true; } \
            | sed -E 's#^(skills|testing)/##' \
            | sort -u \
            | jq -R . | jq -sc .)
          # Intersect against what is on disk: testing/ also holds non-skill directories
          # (skills-boundaries/) and loose files, so a path-derived name is a CANDIDATE, not
          # a skill. Passing one through becomes a matrix entry that fails deep inside the
          # harness on a skill that does not exist.
          SKILLS=$(jq -cn --argjson c "$CANDIDATES" --argjson all "$ALL_SKILLS" \
            '$c - ($c - $all)')
          DROPPED=$(jq -cn --argjson c "$CANDIDATES" --argjson all "$ALL_SKILLS" '$c - $all')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Will screen: $SKILLS"
          # Say what was dropped. A silent skip and "nothing to screen" look identical, and
          # for a path that SHOULD have been a skill that is the wrong thing to be quiet about.
          [ "$DROPPED" = "[]" ] || echo "::notice::Ignored non-skill paths: $DROPPED"

  screen:
    needs: [detect]
    # On workflow_dispatch `detect` is skipped, so this cannot require its success — but it
    # must not run after a FAILED detect either, because the matrix expression below would
    # then evaluate fromJSON('') on an empty output. Plain `always()` does exactly that.
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.detect.result == 'success' && needs.detect.outputs.skills != '[]'))
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.skill)) || fromJSON(needs.detect.outputs.skills) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: qa_pr_screen
      # A CONCURRENCY cap, not a case count — see qa-mutation-battery.yml's MAX_SAMPLES
      # note on why 4 is too many agent+mongo container pairs for a 2-vCPU runner.
      MAX_SAMPLES: "2"
      # TODO(pending Application Security review) — see qa-mutation-battery.yml.
      GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
      GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
    steps:
      # Fail loud, not silent no-op. The triggers above are deliberately commented out
      # pending the Application Security review (see header). If they are uncommented
      # before GROVE_API_KEY / GROVE_BASE_URL are provisioned as Actions secrets on this
      # repo, the harness step below would otherwise fail with an opaque 401 — or, worse,
      # a future guard that skips on missing creds would let every screen quietly no-op
      # while looking green. This step turns "secret absent" into a one-line ::error::
      # naming exactly what is missing, before any checkout or model call is spent.
      - name: Require model-API credentials
        env:
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${GROVE_API_KEY:-}" ] && missing+=("GROVE_API_KEY")
          [ -z "${GROVE_BASE_URL:-}" ] && missing+=("GROVE_BASE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${missing[*]} not set as Actions secrets on this repo. This workflow must not be enabled (uncomment its pull_request trigger) until the Application Security review lands and these secrets are provisioned. A missing secret should fail loudly here, not let the harness step no-op or fail with an opaque 401."
            exit 1
          fi

      - name: Checkout agent-skills at the PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: agent-skills
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.pull_request.head.sha }}

      - name: Generate a token for the agent-skills-evals GitHub App
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AGENT_SKILLS_EVALS_APP_ID }}
          private-key: ${{ secrets.AGENT_SKILLS_EVALS_APP_PRIVATE_KEY }}
          owner: 10gen
          repositories: agent-skills-evals

      - name: Checkout agent-skills-evals (private, sibling checkout)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 10gen/agent-skills-evals
          token: ${{ steps.app-token.outputs.token }}
          path: agent-skills-evals

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.12"

      - name: Run skill-off then skill-on (k=1 — this is a screen, not a measurement)
        working-directory: agent-skills-evals/inspect
        run: |
          set -euo pipefail
          uv sync
          uv run python harness.py --skill "${{ matrix.skill }}" --no-skill \
            --model "$PANEL_MODEL" --epochs 1 --max-samples "$MAX_SAMPLES"
          uv run python harness.py --skill "${{ matrix.skill }}" \
            --model "$PANEL_MODEL" --epochs 1 --max-samples "$MAX_SAMPLES"

      - name: Build the sanitized PR comment
        working-directory: agent-skills-evals/inspect
        run: |
          uv run python screen_report.py --skill "${{ matrix.skill }}" \
            --model "$PANEL_MODEL" > comment.md

      - name: Show the comment in the job summary
        run: cat "agent-skills-evals/inspect/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: github.event_name == 'pull_request' || github.event.inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          # screen_report.py emits this marker as the comment's first line
          # (screen_report.marker(), asserted in test_screen_report.py), which is what lets
          # successive pushes update one comment instead of stacking new ones.
          MARKER="<!-- qa-screen-check:${{ matrix.skill }} -->"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          # -F body=@file, not -f body="$(cat ...)": the comment is multi-line markdown and
          # passing it through a shell interpolation is a needless quoting hazard.
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING" -X PATCH \
              -F body=@agent-skills-evals/inspect/comment.md
          else
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -X POST \
              -F body=@agent-skills-evals/inspect/comment.md
          fi
